# =============================================================================
# config/template.yaml
#
# Configuracao de exemplo para a planilha "planilha_exemplo.csv".
# Copie este arquivo, ajuste os campos abaixo e salve com um nome unico
# (ex: config/colecao_borboletas.yaml) para adicionar uma nova planilha ao
# pipeline -- NENHUMA alteracao de codigo R e necessaria.
# =============================================================================

# Nome do arquivo dentro de dados/raw/
raw_file: "planilha_exemplo.csv"

# Tipo do arquivo bruto: csv | tsv | xlsx | pdf
file_type: "csv"

# Delimitador (apenas para csv/tsv; ignorado para xlsx/pdf)
delimiter: ","

# Codificacao do arquivo
encoding: "UTF-8"

# Aba a ler, se file_type = xlsx (nome ou numero). Ignorado para outros tipos.
sheet: 1

# Metadados fixos: adicionados como colunas constantes na saida *_dwc.csv
fixed_metadata:
  basisOfRecord: "PreservedSpecimen"
  datasetName: "Colecao Exemplo - Museu XYZ"
  institutionCode: "MUS-XYZ"
  license: "CC-BY 4.0"

# Tipagem explicita de colunas do dado BRUTO (nomes originais da planilha).
# Tipos suportados: numeric | integer | character
column_types:
  Latitude: numeric
  Longitude: numeric
  Numero_Tombo: character

# Colunas de data a padronizar para ISO 8601 (AAAA-MM-DD).
# A chave (ex: eventDate) e o nome da coluna derivada que sera criada.
# 'formats' e a ordem de tentativas de parsing (lubridate::parse_date_time).
# Por padrao, o valor ORIGINAL (antes do parsing) e automaticamente
# preservado como campo verbatim (aqui, "verbatimEventDate"). Para
# desativar isso ou escolher outro nome de termo verbatim, use
# 'keep_verbatim: false' ou 'verbatim_term: "outroTermo"'.
date_columns:
  eventDate:
    original_column: "Data_Coleta"
    formats: ["dmy", "ymd", "mdy"]
    # keep_verbatim: true        # (padrao) gera "verbatimEventDate" automaticamente
    # verbatim_term: "verbatimEventDate"  # nome padrao, pode ser sobrescrito

# Mapeamento De/Para explicito para campos VERBATIM: "coluna original" ->
# "termo verbatim Darwin Core". Use para qualquer campo que deva ser
# preservado exatamente como veio na planilha (sem trocar tipo/formato),
# alem dos campos de data (que ja sao cobertos automaticamente acima).
verbatim_mapping:
  "Latitude": "verbatimLatitude"
  "Longitude": "verbatimLongitude"

# Mapeamento De/Para: "coluna original ou derivada" -> "termo Darwin Core".
# Para usar uma coluna de data ja padronizada acima, referencie pela sua
# chave de saida (ex: "eventDate": "eventDate").
dwc_mapping:
  "Numero_Tombo": "catalogNumber"
  "Nome_Cientifico": "scientificName"
  "Coletor": "recordedBy"
  "Latitude": "decimalLatitude"
  "Longitude": "decimalLongitude"
  "Localidade": "locality"
  "eventDate": "eventDate"
