# =============================================================================
# config/template.yaml
# (exemplo atualizado)
# =============================================================================

raw_file: "anfibios/kelly_torralvo/planilha_amostragem_anuros_Tefe.csv"
file_type: "csv"
delimiter: ";"
encoding: "UTF-8"
sheet: 1

# Delimitador para os arquivos de saída (opcional). Padrão: ",".
# Valores comuns: "," (vírgula), ";" (ponto e vírgula), "\t" (tab).
output_delimiter: ";"

fixed_metadata:
  datasetName: "[A DEFINIR]"
  institutionCode: "[A DEFINIR]"
  ownerInstitutionCode: "[A DEFINIR]"
  license: "CC BY 4.0"
  language: "pt"
  country: "Brazil"
  countryCode: "BR"

column_types:
  ID: character
  Local: character
  Trilha: character
  Parcela: character
  Latitude: numeric
  Longitude: numeric
  Amostragem: integer
  Data: character
  Temperatura: numeric
  Umidade: numeric
  Grupo: character
  Familia: character
  Especie: character
  Individuos_EO: integer
  Individuos_Vocal: integer
  Individuos_Avist: integer
  TOTAL: integer
  Segmento_parcela: character
  N_coletado: integer
  Codigo_Coleta: character
  Tecido: character
  Colecao_destino: character
  Codigo_Tombo: character
  Inicio: character
  Fim: character
  Coletor_principal: character
  Observacao: character

date_columns:
  eventDate:
    original_column: "Data"
    formats:
      - "ymd HMS"
      - "ymd HM"
      - "ymd"
      - "dmy HMS"
      - "dmy HM"
      - "dmy"
      - "mdy HMS"
      - "mdy HM"
      - "mdy"
    verbatim_term: "verbatimEventDate"

verbatim_mapping:
  "Data": "verbatimEventDate"
  "Latitude": "verbatimLatitude"
  "Longitude": "verbatimLongitude"
  "Local": "verbatimLocality"
  "Especie": "verbatimIdentification"
  "Coletor_principal": "verbatimCollector"
  "Codigo_Coleta": "verbatimLabel"

dwc_mapping:
  "ID": "occurrenceID"
  "Local": "locality"
  "Trilha": "locationRemarks"
  "Parcela": "locationID"
  "Latitude": "decimalLatitude"
  "Longitude": "decimalLongitude"
  "Amostragem": "eventID"
  "Data": "eventDate"
  # Exemplo de como mapear para dynamicProperties:
  # Cada coluna é mapeada para dynamicProperties.<propriedade>
  "Temperatura": "dynamicProperties.airTemperature"
  "Umidade": "dynamicProperties.relativeHumidity"
  "Grupo": "dynamicProperties.taxonGroup"
  "Individuos_EO": "dynamicProperties.occasionalIndividuals"
  "Individuos_Vocal": "dynamicProperties.vocalIndividuals"
  "Individuos_Avist": "dynamicProperties.visualIndividuals"
  "Segmento_parcela": "dynamicProperties.plotSegment"
  "N_coletado": "dynamicProperties.collectedIndividuals"
  "Inicio": "dynamicProperties.startTime"
  "Fim": "dynamicProperties.endTime"
  "Observacao": "dynamicProperties.observation"
  "Familia": "family"
  "Especie": "scientificName"
  "TOTAL": "individualCount"
  "Codigo_Coleta": "fieldNumber"
  "Tecido": "preparations"
  "Colecao_destino": "institutionCode"
  "Codigo_Tombo": "catalogNumber"
  "Coletor_principal": "recordedBy"