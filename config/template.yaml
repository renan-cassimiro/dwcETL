# =============================================================================
# config/template.yaml
# (exemplo atualizado)
# =============================================================================

raw_file: "anfibios/kelly_torralvo/planilha_amostragem_anuros_Tefe.csv"
file_type: "csv"
delimiter: ";"
encoding: "UTF-8"
sheet: 1

# Delimitador para os arquivos de saída (opcional). Padrão: ",".
# Valores comuns: "," (vírgula), ";" (ponto e vírgula), "\t" (tab).
output_delimiter: ";"

fixed_metadata:
  datasetName: "[A DEFINIR]"
  institutionCode: "[A DEFINIR]"
  ownerInstitutionCode: "[A DEFINIR]"
  license: "CC BY 4.0"
  language: "pt"
  country: "Brazil"
  countryCode: "BR"

column_types:
  ID: character
  Local: character
  Trilha: character
  Parcela: character
  Latitude: numeric
  Longitude: numeric
  Amostragem: integer
  Data: character
  Temperatura: numeric
  Umidade: numeric
  Grupo: character
  Familia: character
  Especie: character
  Individuos_EO: integer
  Individuos_Vocal: integer
  Individuos_Avist: integer
  TOTAL: integer
  Segmento_parcela: character
  N_coletado: integer
  Codigo_Coleta: character
  Tecido: character
  Colecao_destino: character
  Codigo_Tombo: character
  Inicio: character
  Fim: character
  Coletor_principal: character
  Observacao: character

date_columns:
  eventDate:
    original_column: "Data"
    formats:
      - "ymd HMS"
      - "ymd HM"
      - "ymd"
      - "dmy HMS"
      - "dmy HM"
      - "dmy"
      - "mdy HMS"
      - "mdy HM"
      - "mdy"
    verbatim_term: "verbatimEventDate"

verbatim_mapping:
  "Data": "verbatimEventDate"
  "Latitude": "verbatimLatitude"
  "Longitude": "verbatimLongitude"
  "Local": "verbatimLocality"
  "Especie": "verbatimIdentification"
  "Coletor_principal": "verbatimCollector"
  "Codigo_Coleta": "verbatimLabel"

dwc_mapping:
  "ID": "occurrenceID"
  "Local": "locality"
  "Trilha": "locationRemarks"
  "Parcela": "locationID"
  "Latitude": "decimalLatitude"
  "Longitude": "decimalLongitude"
  "Amostragem": "eventID"
  "Data": "eventDate"
  # Exemplo de como mapear para dynamicProperties:
  # Cada coluna é mapeada para dynamicProperties.<propriedade>
  "Temperatura": "dynamicProperties.airTemperature"
  "Umidade": "dynamicProperties.relativeHumidity"
  "Grupo": "dynamicProperties.taxonGroup"
  "Individuos_EO": "dynamicProperties.occasionalIndividuals"
  "Individuos_Vocal": "dynamicProperties.vocalIndividuals"
  "Individuos_Avist": "dynamicProperties.visualIndividuals"
  "Segmento_parcela": "dynamicProperties.plotSegment"
  "N_coletado": "dynamicProperties.collectedIndividuals"
  "Inicio": "dynamicProperties.startTime"
  "Fim": "dynamicProperties.endTime"
  "Observacao": "dynamicProperties.observation"
  "Familia": "family"
  "Especie": "scientificName"
  "TOTAL": "individualCount"
  "Codigo_Coleta": "fieldNumber"
  "Tecido": "preparations"
  "Colecao_destino": "institutionCode"
  "Codigo_Tombo": "catalogNumber"
  "Coletor_principal": "recordedBy"
  
# Descrições dos campos de entrada (colunas originais)
field_descriptions:
  "ID": "Identificador único do registro na planilha original"
  "Local": "Nome da localidade ou ponto de coleta (ex: nome da UC, município)"
  "Trilha": "Identificação da trilha percorrida (campo específico do RAPELD)"
  "Parcela": "Código ou nome da parcela de amostragem"
  "Latitude": "Coordenada latitude em graus decimais (formato DD.dddd)"
  "Longitude": "Coordenada longitude em graus decimais (formato DD.dddd)"
  "Amostragem": "Número ou código da campanha de amostragem"
  "Data": "Data do evento de coleta (formato regional variado)"
  "Temperatura": "Temperatura do ar no momento da coleta (°C)"
  "Umidade": "Umidade relativa do ar no momento da coleta (%)"
  "Grupo": "Grupo taxonômico superior (ex: Anura, Squamata)"
  "Familia": "Família taxonômica"
  "Especie": "Nome científico completo (gênero + epíteto específico)"
  "Individuos_EO": "Número de indivíduos registrados por encontro ocasional"
  "Individuos_Vocal": "Número de indivíduos registrados por vocalização"
  "Individuos_Avist": "Número de indivíduos registrados por avistamento visual"
  "TOTAL": "Número total de indivíduos contabilizados"
  "Segmento_parcela": "Segmento da parcela onde o registro foi feito"
  "N_coletado": "Número de indivíduos coletados para depósito"
  "Codigo_Coleta": "Código de campo atribuído ao espécime coletado"
  "Tecido": "Tipo de tecido preservado (ex: músculo, fígado)"
  "Colecao_destino": "Instituição de destino da coleção"
  "Codigo_Tombo": "Número de tombo na coleção biológica"
  "Inicio": "Hora de início do evento de coleta (HH:MM)"
  "Fim": "Hora de término do evento de coleta (HH:MM)"
  "Coletor_principal": "Nome do pesquisador responsável pela coleta"
  "Observacao": "Observações gerais sobre o evento ou registro"

# Descrições dos campos de saída (termos Darwin Core)
dwc_term_descriptions:
  "occurrenceID": "Identificador único global da ocorrência (persistente)"
  "locality": "Descrição textual da localidade (ex: nome da UC, município)"
  "locationRemarks": "Comentários sobre a localização (ex: trilha, parcela)"
  "locationID": "Código ou identificador da parcela ou ponto de amostragem"
  "decimalLatitude": "Coordenada latitude em graus decimais (WGS84)"
  "decimalLongitude": "Coordenada longitude em graus decimais (WGS84)"
  "eventID": "Identificador do evento de amostragem"
  "eventDate": "Data do evento no formato ISO 8601 (AAAA-MM-DD)"
  "family": "Nome da família taxonômica"
  "scientificName": "Nome científico completo (gênero + epíteto específico)"
  "individualCount": "Número de indivíduos representados pela ocorrência"
  "fieldNumber": "Código de campo atribuído ao espécime"
  "preparations": "Tipo de preparação preservada (ex: tecido)"
  "institutionCode": "Código da instituição responsável pela coleção"
  "catalogNumber": "Número de tombo na coleção biológica"
  "eventTime": "Hora de início do evento (HH:MM:SS)"
  "recordedBy": "Pessoa(s) responsável(eis) pelo registro"
  "eventRemarks": "Comentários sobre o evento de coleta"
  "verbatimEventDate": "Data original exatamente como registrada"
  "verbatimLatitude": "Latitude original exatamente como registrada"
  "verbatimLongitude": "Longitude original exatamente como registrada"
  "verbatimLocality": "Localidade original exatamente como registrada"
  "verbatimIdentification": "Identificação original exatamente como registrada"
  "verbatimCollector": "Coletor original exatamente como registrado"
  "verbatimLabel": "Rótulo original exatamente como registrado"
  "dynamicProperties": "Propriedades dinâmicas em formato JSON (ex: temperatura, umidade, etc.)"